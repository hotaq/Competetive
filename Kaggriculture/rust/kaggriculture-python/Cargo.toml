[package]
name = "kaggriculture-python"
version = "0.1.0"
edition = "2024"
description = "PyO3 adapter for the Kaggriculture Rust engine"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
kaggriculture-engine = { path = "../kaggriculture-engine" }
kaggriculture-executor = { path = "../kaggriculture-executor" }
pyo3 = { version = "=0.23.5", features = ["abi3-py311", "extension-module"] }
serde = { version = "=1.0.229" }
serde_json = "=1.0.151"
