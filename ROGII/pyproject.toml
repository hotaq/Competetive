[project]
name = "rogii-wellbore"
version = "0.1.0"
description = "Reproducible solution for the ROGII Wellbore Geology Prediction competition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.scripts]
rogii-make-submission = "rogii.submission:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rogii"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

